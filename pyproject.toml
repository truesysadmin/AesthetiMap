[project]
name = "aesthetimap"
version = "0.3.0"
description = "AesthetiMap — generate stunning, customizable map art posters for any city in the world."
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [
    {name = "Denys Rastiegaiev", email = "denys.rastiegaiev@gmail.com"}
]
keywords = ["map", "poster", "osm", "openstreetmap", "art", "visualization", "aesthetimap"]

dependencies = [
    "elevation==1.1.3",
    "geopy==2.5.0",
    "lat-lon-parser==1.3.1",
    "mapbox-vector-tile==2.2.0",
    "matplotlib==3.11.2",
    "numpy==2.5.5",
    "pillow==13.0.0",
    "pyproj==3.8.0",
    "rasterio==1.5.0",
    "requests==2.34.2",
    "shapely==2.2.0",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["renderer", "tiles", "font_management"]
