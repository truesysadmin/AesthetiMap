services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8000:8000"
    cap_drop:
      - ALL
    environment:
      - MAX_CLEANUP_DAYS=7
      - MAX_CLEANUP_MB=1024
      - CLEANUP_INTERVAL_HOURS=6
    volumes:
      - ./cache:/app/cache
      - ./posters:/app/posters
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped
    networks:
      - internal

    deploy:
      resources:
        limits:
          cpus: '4.0'
          memory: '8192M'

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped
    networks:
      - internal

    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: '256M'

networks:
  internal:
