resolver 127.0.0.11 valid=10s ipv6=off;
limit_req_zone $binary_remote_addr zone=map_generation:10m rate=6r/m;
limit_conn_zone $binary_remote_addr zone=map_connections:10m;

server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    client_max_body_size 16k;

    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    set_real_ip_from 10.0.0.0/8;
    real_ip_header X-Real-IP;

    gzip on;
    gzip_types text/plain text/css text/javascript application/javascript application/json application/xml image/svg+xml;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options DENY always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' blob: data:; style-src 'self' 'unsafe-inline'; font-src 'self' data:; connect-src 'self' https://geocoding-api.open-meteo.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

    set $backend http://backend:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    location = /api/generate_map_stream {
        limit_req zone=map_generation burst=5 nodelay;
        limit_req_status 429;
        limit_conn map_connections 2;
        limit_conn_status 429;
        proxy_pass $backend$request_uri;
        proxy_pass_header X-Accel-Buffering;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 700s;
    }

    location /api/ {
        proxy_pass $backend$request_uri;
        proxy_read_timeout 700s;
    }

    location = /healthz {
        default_type text/plain;
        return 200 "ok";
    }

    location /assets/ {
        expires 1y;
        try_files $uri $uri/ =404;
    }

    location = /index.html {
        expires -1;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
